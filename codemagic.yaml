# ─── Codemagic CI/CD Configuration for Next.js Web App ────────────────────────
workflows:
  nextjs-web-build:
    name: Next.js Web App Build & Validation
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 20
      npm: 10
      vars:
        NODE_ENV: production
        NEXT_TELEMETRY_DISABLED: "1"
        CI: "false"
        # Dummy API keys so the build doesn't fail on missing env vars
        GEMINI_API_KEY: "placeholder_build_only"
        NEXT_PUBLIC_GEMINI_API_KEY: "placeholder_build_only"
        OPENAI_API_KEY: "placeholder_build_only"
        ANTHROPIC_API_KEY: "placeholder_build_only"
        DEEPSEEK_API_KEY: "placeholder_build_only"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Install Node.js Dependencies
        script: |
          node --version
          npm --version
          npm install --legacy-peer-deps
      - name: Run TypeScript Check
        script: |
          npx tsc --noEmit || true
      - name: Build Next.js Production Bundle
        script: |
          export NEXT_TELEMETRY_DISABLED=1
          export CI=false
          export GEMINI_API_KEY=placeholder_build_only
          export NEXT_PUBLIC_GEMINI_API_KEY=placeholder_build_only
          npm run build
    artifacts:
      - .next/**/*
      - out/**/*
